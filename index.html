<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語 SEL 解憂發光罐闖關</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; background-color: #fef08a; }
        .hand-drawn { border: 3px solid #333; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; }
        .hand-drawn-btn { border: 2px solid #333; border-radius: 15px 225px 15px 255px/255px 15px 225px 15px; box-shadow: 4px 4px 0px #333; transition: all 0.1s; }
        .hand-drawn-btn:active { box-shadow: 0px 0px 0px #333; transform: translate(4px, 4px); }
        .hand-drawn-btn:disabled { opacity: 0.6; box-shadow: none; transform: translate(4px, 4px); cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div id="root" class="w-full max-w-4xl"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const GAS_URL = "https://script.google.com/macros/s/AKfycbzIdOwg3RByzsO3OqPfrtPEfDlGN_VRIbIciixM1mEoQlzvvT89-zNF_kKeY4WYWINzcg/exec";

        const CASES = {
            1: { desc: "椅仔歹去，逐家攏講「是阿勇挵歹去的」...", ansEmotion: "受氣", ansMetaphor: "欲爆炸的火山", words: ["阿勇", "氣甲", "頭殼衝煙，", "若", "欲爆炸的火山"] },
            2: { desc: "同學笑伊的作品「有夠歹看」...", ansEmotion: "傷心", ansMetaphor: "流袂停的水道頭", words: ["阿勇", "傷心甲", "流目屎，", "若", "流袂停的水道頭"] },
            3: { desc: "零分的考試單猶袂予阿母簽名...", ansEmotion: "煩惱", ansMetaphor: "鼎底咧煎魚", words: ["阿勇", "煩惱甲", "睏袂去，", "若", "鼎底咧煎魚"] },
            4: { desc: "分組的時，好朋友無和伊做伙...", ansEmotion: "鬱卒", ansMetaphor: "消風的雞胿", words: ["阿勇", "鬱卒甲", "頭犁犁，", "若", "消風的雞胿"] },
            5: { desc: "早起出門，佇巷仔口予狗仔逐...", ansEmotion: "驚惶", ansMetaphor: "看著鬼", words: ["阿勇", "驚甲", "吱吱叫，", "若", "看著鬼"] },
            6: { desc: "社會課愛上台報告...", ansEmotion: "緊張", ansMetaphor: "拍袂停的鼓", words: ["阿勇", "緊張甲", "心臟噗噗跳，", "若", "拍袂停的鼓"] }
        };

        const EMOTIONS = ["傷心", "受氣", "煩惱", "鬱卒", "驚惶", "緊張"];
        const METAPHORS = ["欲爆炸的火山", "流袂停的水道頭", "鼎底咧煎魚", "消風的雞胿", "看著鬼", "拍袂停的鼓"];

        const SENTENCES = [
            "歡喜嘛一工，煩惱嘛一工，莫煩惱啦！",
            "莫傷心，阮會陪你，咱做伙加油！",
            "莫驚莫驚，有阮佇遮，阮會保護你！",
            "放予輕鬆，免緊張，咱做伙向前衝！",
            "莫受氣啦！快快樂樂過日子！",
            "莫鬱卒啦！咱永遠是好朋友！"
        ];

        const STORAGE_KEY = "ayong_sel_game_state_v1";

        // 🎙️ 標準 16kHz 單聲道 WAV 編碼器（具備完整音長標頭，Google Drive 可正確顯示秒數與播放）
        const encodeWAV = (samples, sampleRate) => {
            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, str) => {
                for (let i = 0; i < str.length; i++) {
                    view.setUint8(offset + i, str.charCodeAt(i));
                }
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + samples.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, 1, true); // Mono
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, samples.length * 2, true);
            let offset = 44;
            for (let i = 0; i < samples.length; i++, offset += 2) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([view], { type: 'audio/wav' });
        };

        const downsampleBuffer = (buffer, inputRate, targetRate = 16000) => {
            if (targetRate >= inputRate) return buffer;
            const ratio = inputRate / targetRate;
            const newLength = Math.round(buffer.length / ratio);
            const result = new Float32Array(newLength);
            let offsetResult = 0;
            let offsetBuffer = 0;
            while (offsetResult < result.length) {
                const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
                let accum = 0, count = 0;
                for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
                    accum += buffer[i];
                    count++;
                }
                result[offsetResult] = count > 0 ? accum / count : 0;
                offsetResult++;
                offsetBuffer = nextOffsetBuffer;
            }
            return result;
        };

        const blobToBase64 = (blob) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        };

        // 圖片極速壓縮（640px / 0.55 畫質，兼顧學習單字跡清晰度與教室 Wi-Fi 秒傳速度）
        const compressImage = (file, maxWidth = 640, quality = 0.55) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error("讀取照片失敗"));
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.onerror = () => {
                        // 若瀏覽器無法轉繪 Canvas，直接回傳原圖 Base64
                        const raw = event.target.result || "";
                        resolve(raw.includes(',') ? raw.split(',')[1] : raw);
                    };
                    img.src = event.target.result;
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            const dataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve(dataUrl.split(',')[1]);
                        } catch (err) {
                            const raw = event.target.result || "";
                            resolve(raw.includes(',') ? raw.split(',')[1] : raw);
                        }
                    };
                };
            });
        };

        const postToGAS = async (payload) => {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                redirect: 'follow',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            });
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                return { status: res.ok ? 'success' : 'error', raw: text };
            }
        };

        const notifyStageComplete = async (stageNum, groupNum) => {
            try {
                await postToGAS({
                    action: 'stage_complete',
                    stage: Number(stageNum),
                    group: Number(groupNum)
                });
            } catch (e) {
                console.error("進度上傳失敗", e);
            }
        };

        const shuffleWordsSafely = (words) => {
            let arr = [...words];
            if (arr.length <= 1) return arr;
            do {
                arr.sort(() => Math.random() - 0.5);
            } while (arr.join("") === words.join(""));
            return arr;
        };

        const loadSavedState = () => {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        };

        function App() {
            const saved = loadSavedState();

            const [group, setGroup] = useState(saved?.group ? Number(saved.group) : null);
            const [stage, setStage] = useState(saved?.stage ?? 0); 
            const [maxUnlockedStage, setMaxUnlockedStage] = useState(saved?.maxUnlockedStage ?? 1);

            const [stage1Passed, setStage1Passed] = useState(saved?.stage1Passed ?? false);
            const [stage2Passed, setStage2Passed] = useState(saved?.stage2Passed ?? false);

            const [selEmotion, setSelEmotion] = useState(saved?.selEmotion ?? null);
            const [selMetaphor, setSelMetaphor] = useState(saved?.selMetaphor ?? null);

            const [photoUrl, setPhotoUrl] = useState(null);
            const [photoFile, setPhotoFile] = useState(null); 
            const [isUploading, setIsUploading] = useState(false);

            const [shuffledWords, setShuffledWords] = useState(() => {
                if (saved?.shuffledWords && saved.shuffledWords.length > 0) return saved.shuffledWords;
                if (saved?.group && CASES[saved.group]) return shuffleWordsSafely(CASES[saved.group].words);
                return [];
            });
            const [selectedWords, setSelectedWords] = useState(saved?.selectedWords ?? []);

            const [selSentence, setSelSentence] = useState(saved?.selSentence ?? null);
            const [isRecording, setIsRecording] = useState(false);
            const [audioUrl, setAudioUrl] = useState(null);
            const [audioBlob, setAudioBlob] = useState(null); 
            const audioCtxRef = useRef(null);
            const mediaStreamRef = useRef(null);
            const scriptProcessorRef = useRef(null);
            const pcmChunksRef = useRef([]);
            const inputSampleRateRef = useRef(44100);

            useEffect(() => {
                try {
                    const stateToSave = {
                        group,
                        stage,
                        maxUnlockedStage,
                        stage1Passed,
                        stage2Passed,
                        selEmotion,
                        selMetaphor,
                        shuffledWords,
                        selectedWords,
                        selSentence
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
                } catch (e) {
                    console.error("進度暫存失敗", e);
                }
            }, [group, stage, maxUnlockedStage, stage1Passed, stage2Passed, selEmotion, selMetaphor, shuffledWords, selectedWords, selSentence]);

            const startGame = (g) => {
                const gNum = Number(g);
                setGroup(gNum);
                setStage(1);
                setMaxUnlockedStage(1);
                setStage1Passed(false);
                setStage2Passed(false);
                setSelEmotion(null);
                setSelMetaphor(null);
                setSelectedWords([]);
                setShuffledWords(shuffleWordsSafely(CASES[gNum].words));
                setSelSentence(null);
                setPhotoUrl(null);
                setPhotoFile(null);
                setAudioUrl(null);
                setAudioBlob(null);
            };

            const resetAllGame = () => {
                if (confirm("確定要重新選擇組別，從頭開始嗎？")) {
                    localStorage.removeItem(STORAGE_KEY);
                    setGroup(null);
                    setStage(0);
                    setMaxUnlockedStage(1);
                    setStage1Passed(false);
                    setStage2Passed(false);
                    setSelEmotion(null);
                    setSelMetaphor(null);
                    setSelectedWords([]);
                    setShuffledWords([]);
                    setSelSentence(null);
                    setPhotoUrl(null);
                    setPhotoFile(null);
                    setAudioUrl(null);
                    setAudioBlob(null);
                }
            };

            const goToStage = (targetStage) => {
                if (targetStage >= 1 && targetStage <= maxUnlockedStage) {
                    setStage(targetStage);
                }
            };

            const checkStage1 = () => {
                if (selEmotion === CASES[group].ansEmotion && selMetaphor === CASES[group].ansMetaphor) {
                    notifyStageComplete(1, group);
                    setStage1Passed(true);
                    setMaxUnlockedStage(prev => Math.max(prev, 2));
                } else {
                    alert("選擇好像不太對喔，再討論看看！");
                }
            };

            const handleWordClick = (word, isSelected, index) => {
                if (stage2Passed) return;
                if (isSelected) {
                    setSelectedWords(prev => prev.filter((_, i) => i !== index));
                    setShuffledWords(prev => [...prev, word]);
                } else {
                    setShuffledWords(prev => prev.filter((_, i) => i !== index));
                    setSelectedWords(prev => [...prev, word]);
                }
            };

            const checkStage2 = () => {
                if (selectedWords.join("") === CASES[group].words.join("")) {
                    notifyStageComplete(2, group);
                    setStage2Passed(true);
                    setMaxUnlockedStage(prev => Math.max(prev, 3));
                } else {
                    alert("順序怪怪的喔，請再排一次看看！");
                    setShuffledWords(shuffleWordsSafely(CASES[group].words));
                    setSelectedWords([]);
                }
            };

            const handlePhotoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setPhotoFile(file);
                    setPhotoUrl(URL.createObjectURL(file));
                }
            };

            const submitStage3 = async () => {
                if (!photoFile) return;
                setIsUploading(true);
                try {
                    const compressedBase64 = await compressImage(photoFile);
                    const payload = {
                        action: 'upload', 
                        stage: 3,
                        group: Number(group),
                        mimeType: 'image/jpeg',
                        fileBase64: compressedBase64
                    };
                    // 平行送出照片上傳與亮燈通知，省去一次 GAS 來回等待時間
                    const [result] = await Promise.all([
                        postToGAS(payload),
                        notifyStageComplete(3, group)
                    ]);
                    if (result.status === 'success') {
                        setMaxUnlockedStage(prev => Math.max(prev, 4));
                        setStage(4);
                    } else {
                        alert("上傳失敗：" + (result.message || "請重試一次"));
                    }
                } catch(error) {
                    alert("連線發生錯誤，請稍後再試！");
                    console.error(error);
                }
                setIsUploading(false);
            };

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            channelCount: 1
                        }
                    });
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioCtx();
                    if (audioCtx.state === 'suspended') {
                        await audioCtx.resume();
                    }
                    inputSampleRateRef.current = audioCtx.sampleRate || 44100;
                    const source = audioCtx.createMediaStreamSource(stream);
                    const processor = audioCtx.createScriptProcessor(4096, 1, 1);

                    pcmChunksRef.current = [];
                    processor.onaudioprocess = (e) => {
                        const channelData = e.inputBuffer.getChannelData(0);
                        pcmChunksRef.current.push(new Float32Array(channelData));
                    };

                    source.connect(processor);
                    processor.connect(audioCtx.destination);

                    audioCtxRef.current = audioCtx;
                    mediaStreamRef.current = stream;
                    scriptProcessorRef.current = processor;
                    setIsRecording(true);
                } catch (err) {
                    alert("無法存取麥克風，請確認權限！");
                    console.error(err);
                }
            };

            const stopRecording = () => {
                if (!isRecording) return;
                setIsRecording(false);
                try {
                    if (scriptProcessorRef.current) {
                        scriptProcessorRef.current.disconnect();
                        scriptProcessorRef.current.onaudioprocess = null;
                        scriptProcessorRef.current = null;
                    }
                    if (mediaStreamRef.current) {
                        mediaStreamRef.current.getTracks().forEach(track => track.stop());
                        mediaStreamRef.current = null;
                    }
                    if (audioCtxRef.current) {
                        audioCtxRef.current.close().catch(() => {});
                        audioCtxRef.current = null;
                    }

                    const chunks = pcmChunksRef.current;
                    const totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
                    const merged = new Float32Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                        merged.set(chunk, offset);
                        offset += chunk.length;
                    }
                    pcmChunksRef.current = [];

                    const targetRate = 16000;
                    const downsampled = downsampleBuffer(merged, inputSampleRateRef.current, targetRate);
                    const wavBlob = encodeWAV(downsampled, targetRate);
                    setAudioBlob(wavBlob);
                    setAudioUrl(URL.createObjectURL(wavBlob));
                } catch (err) {
                    alert("錄音整理失敗，請再試一次！");
                    console.error(err);
                }
            };

            const submitStage4 = async () => {
                if (!audioBlob) return;
                setIsUploading(true);
                try {
                    const base64 = await blobToBase64(audioBlob);
                    const payload = {
                        action: 'upload', 
                        stage: 4,
                        group: Number(group),
                        mimeType: 'audio/wav',
                        fileBase64: base64
                    };
                    const [result] = await Promise.all([
                        postToGAS(payload),
                        notifyStageComplete(4, group)
                    ]);
                    if (result.status === 'success') {
                        localStorage.removeItem(STORAGE_KEY);
                        setStage(5);
                    } else {
                        alert("上傳失敗：" + (result.message || "請重試一次"));
                    }
                } catch(error) {
                    alert("連線發生錯誤，請稍後再試！");
                    console.error(error);
                }
                setIsUploading(false);
            };

            if (stage === 0) {
                return (
                    <div className="bg-white p-8 hand-drawn text-center w-full max-w-2xl mx-auto shadow-lg">
                        <h1 className="text-3xl md:text-4xl font-bold mb-8 text-orange-600">🎒 台語 SEL 解憂闖關</h1>
                        <p className="mb-6 text-xl">請選擇你們的組別開始挑戰：</p>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                            {[1,2,3,4,5,6].map(g => (
                                <button key={g} onClick={() => startGame(g)} className="hand-drawn-btn bg-blue-200 hover:bg-blue-300 p-4 md:p-6 text-xl md:text-2xl font-bold">
                                    第 {g} 組
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            if (stage === 5) {
                return (
                    <div className="bg-white p-12 hand-drawn text-center max-w-2xl mx-auto shadow-lg">
                        <h1 className="text-5xl font-bold mb-6 text-red-500">🎉 任務完成！</h1>
                        <p className="text-2xl mb-8">請看前面大螢幕的發光罐！</p>
                        <div className="text-8xl mt-4 animate-bounce">🌟🧡🌟</div>
                        <button onClick={resetAllGame} className="mt-10 hand-drawn-btn bg-gray-200 hover:bg-gray-300 px-6 py-3 text-lg font-bold">
                            回到組別選擇
                        </button>
                    </div>
                );
            }

            return (
                <div className="bg-white p-6 md:p-10 hand-drawn w-full max-w-4xl mx-auto shadow-lg">
                    <div className="flex flex-wrap justify-between items-center gap-3 mb-6 border-b-4 border-dashed border-gray-300 pb-4">
                        <div className="flex flex-wrap items-center gap-3">
                            <h2 className="text-2xl md:text-3xl font-bold text-blue-700">第 {group} 組 - 第 {stage} 關</h2>
                            <div className="flex items-center gap-1.5">
                                {[1, 2, 3, 4].map(sNum => {
                                    const unlocked = sNum <= maxUnlockedStage;
                                    const isCurrent = sNum === stage;
                                    return (
                                        <button
                                            key={sNum}
                                            disabled={!unlocked}
                                            onClick={() => goToStage(sNum)}
                                            className={`px-3 py-1 rounded-full text-sm md:text-base font-bold border-2 border-gray-800 transition ${
                                                isCurrent
                                                    ? 'bg-orange-400 text-white'
                                                    : unlocked
                                                        ? 'bg-green-200 hover:bg-green-300 text-gray-900 cursor-pointer'
                                                        : 'bg-gray-100 text-gray-400 border-gray-300 cursor-not-allowed'
                                            }`}
                                        >
                                            第{sNum}關
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <button
                            onClick={resetAllGame}
                            className="text-sm md:text-base px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 border border-gray-400 font-bold text-gray-700"
                        >
                            換組別
                        </button>
                    </div>

                    {stage === 3 && selEmotion && selMetaphor && (
                        <div className="mb-5 bg-amber-100 border-2 border-amber-400 px-4 py-2 rounded-xl text-base md:text-lg font-bold text-amber-900 inline-block">
                            📌 本組密碼：【{selEmotion}】｜【{selMetaphor}】
                        </div>
                    )}

                    {stage === 1 && (
                        <div>
                            <h3 className="text-2xl font-bold mb-6 bg-yellow-200 inline-block px-6 py-3 hand-drawn shadow-sm">
                                📝 案件描述：{CASES[group].desc}
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mt-6">
                                <div className="border-4 border-yellow-400 p-6 rounded-2xl bg-yellow-50">
                                    <h4 className="text-center font-bold text-2xl mb-6 text-yellow-800">選擇情緒</h4>
                                    <div className="grid grid-cols-2 gap-4">
                                        {EMOTIONS.map(e => (
                                            <button 
                                                key={e} 
                                                disabled={stage1Passed}
                                                onClick={() => setSelEmotion(e)} 
                                                className={`hand-drawn-btn p-4 text-xl font-bold ${selEmotion === e ? 'bg-yellow-500 text-white' : 'bg-white'}`}
                                            >
                                                {e}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="border-4 border-blue-400 p-6 rounded-2xl bg-blue-50">
                                    <h4 className="text-center font-bold text-2xl mb-6 text-blue-800">選擇比喻</h4>
                                    <div className="grid grid-cols-2 gap-4">
                                        {METAPHORS.map(m => (
                                            <button 
                                                key={m} 
                                                disabled={stage1Passed}
                                                onClick={() => setSelMetaphor(m)} 
                                                className={`hand-drawn-btn p-4 text-xl font-bold ${selMetaphor === m ? 'bg-blue-500 text-white' : 'bg-white'}`}
                                            >
                                                {m}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {!stage1Passed && selEmotion && selMetaphor && (
                                <button onClick={checkStage1} className="mt-10 w-full hand-drawn-btn bg-green-400 hover:bg-green-500 p-6 text-3xl font-bold text-white tracking-widest">
                                    送出答案
                                </button>
                            )}

                            {stage1Passed && (
                                <div className="mt-8 p-6 bg-green-50 border-4 border-green-500 rounded-2xl text-center shadow-md">
                                    <p className="text-2xl font-bold text-green-700 mb-3">✅ 著啦！請 1 號同學共答案抄佇學習單頂懸：</p>
                                    <div className="bg-white border-2 border-green-300 rounded-xl p-4 mb-6 text-2xl md:text-3xl font-bold text-gray-800 flex flex-wrap justify-center gap-6">
                                        <span>心情：<span className="text-orange-600 underline decoration-4">{selEmotion}</span></span>
                                        <span>比喻：<span className="text-blue-600 underline decoration-4">{selMetaphor}</span></span>
                                    </div>
                                    <button 
                                        onClick={() => setStage(2)} 
                                        className="w-full hand-drawn-btn bg-blue-500 hover:bg-blue-600 p-5 text-2xl md:text-3xl font-bold text-white tracking-wider"
                                    >
                                        抄好矣！前往第二關 ➔
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {stage === 2 && (
                        <div className="text-center">
                            <h3 className="text-3xl font-bold mb-8">
                                {stage2Passed ? "✅ 句型重組完全正確！" : "請點擊下方字塊，依序排到上方！"}
                            </h3>
                            <div className={`min-h-[120px] p-6 mb-8 rounded-2xl flex flex-wrap gap-3 justify-center items-center shadow-inner border-4 ${stage2Passed ? 'bg-green-50 border-green-500' : 'bg-gray-50 border-dashed border-gray-400'}`}>
                                {selectedWords.length === 0 && <span className="text-gray-400 text-xl">請點擊下方字塊排入</span>}
                                {selectedWords.map((word, idx) => (
                                    <button 
                                        key={idx} 
                                        disabled={stage2Passed}
                                        onClick={() => handleWordClick(word, true, idx)} 
                                        className={`hand-drawn-btn px-6 py-3 text-2xl md:text-3xl font-bold ${stage2Passed ? 'bg-amber-200 border-amber-600' : 'bg-orange-300'}`}
                                    >
                                        {word}
                                    </button>
                                ))}
                            </div>

                            {!stage2Passed && (
                                <div className="flex flex-wrap gap-4 justify-center mb-10 p-6 bg-blue-50 rounded-2xl hand-drawn border-2">
                                    {shuffledWords.map((word, idx) => (
                                        <button key={idx} onClick={() => handleWordClick(word, false, idx)} className="hand-drawn-btn bg-blue-200 hover:bg-blue-300 px-6 py-3 text-2xl font-bold">{word}</button>
                                    ))}
                                </div>
                            )}

                            {!stage2Passed && selectedWords.length === CASES[group].words.length && (
                                <button onClick={checkStage2} className="hand-drawn-btn bg-green-400 hover:bg-green-500 p-6 text-3xl font-bold w-full text-white tracking-widest">
                                    檢查順序
                                </button>
                            )}

                            {stage2Passed && (
                                <div className="mt-6 p-6 bg-green-50 border-4 border-green-500 rounded-2xl text-center shadow-md">
                                    <p className="text-xl font-bold text-green-700 mb-2">📌 完整通關句子（確認好再進入下一關）：</p>
                                    <p className="text-2xl md:text-3xl font-bold text-blue-900 bg-white border-2 border-green-300 rounded-xl p-4 mb-6">
                                        {selectedWords.join("")}
                                    </p>
                                    <button 
                                        onClick={() => setStage(3)} 
                                        className="w-full hand-drawn-btn bg-blue-500 hover:bg-blue-600 p-5 text-2xl md:text-3xl font-bold text-white tracking-wider"
                                    >
                                        好矣！前往第三關（解憂法寶） ➔
                                    </button>
                                </div>
                            )}

                            <div className="mt-6 text-left">
                                <button onClick={() => goToStage(1)} className="text-blue-700 underline font-bold text-lg">
                                    ← 回到第一關看答案
                                </button>
                            </div>
                        </div>
                    )}

                    {stage === 3 && (
                        <div className="text-center">
                            <h3 className="text-3xl font-bold mb-4">請小組討論欲用佗一个法寶？</h3>
                            <p className="mb-6 text-xl text-gray-700">請 3 號寫佇實體配方內底，寫好才翕相傳來！</p>
                            <div className="my-10">
                                <label className="hand-drawn-btn bg-pink-300 hover:bg-pink-400 p-8 text-3xl font-bold cursor-pointer inline-block shadow-lg">
                                    📸 點擊選擇照片或拍照
                                    <input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} />
                                </label>
                            </div>
                            {photoUrl && (
                                <div className="mt-8 bg-gray-100 p-6 rounded-xl hand-drawn">
                                    <img src={photoUrl} alt="預覽" className="max-w-sm mx-auto border-8 border-white shadow-md transform rotate-2 mb-6" />
                                    <button onClick={submitStage3} disabled={isUploading} className="hand-drawn-btn bg-green-400 p-6 text-2xl font-bold w-full max-w-sm text-white">
                                        {isUploading ? "圖片壓縮與上傳中 ⏳..." : "上傳照片並送出 📤"}
                                    </button>
                                </div>
                            )}

                            <div className="mt-8 flex justify-between items-center text-lg font-bold">
                                <button onClick={() => goToStage(2)} className="text-blue-700 underline">
                                    ← 回到第二關
                                </button>
                                {maxUnlockedStage >= 4 && (
                                    <button onClick={() => goToStage(4)} className="text-green-700 underline">
                                        前往第四關 →
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {stage === 4 && (
                        <div className="text-center">
                            {!selSentence ? (
                                <>
                                    <h3 className="text-3xl font-bold mb-8">請選一句話送予阿勇！</h3>
                                    <div className="flex flex-col gap-5">
                                        {SENTENCES.map((s, idx) => (
                                            <button key={idx} onClick={() => setSelSentence(s)} className="hand-drawn-btn bg-yellow-200 hover:bg-yellow-300 p-6 text-left text-xl font-bold shadow-sm">
                                                {s}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="mt-8 text-left">
                                        <button onClick={() => goToStage(3)} className="text-blue-700 underline font-bold text-lg">
                                            ← 回到第三關
                                        </button>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <button onClick={() => setSelSentence(null)} className="text-blue-600 underline mb-6 text-left w-full text-lg font-bold">← 重新選擇金句</button>
                                    <div className="bg-blue-100 p-10 hand-drawn text-4xl font-bold mb-10 leading-relaxed text-blue-900 shadow-sm">
                                        {selSentence}
                                    </div>
                                    <div className="flex flex-col items-center gap-6">
                                        {!isRecording && !audioUrl && (
                                            <button onClick={startRecording} className="hand-drawn-btn bg-red-400 hover:bg-red-500 text-white p-8 text-3xl font-bold rounded-full shadow-lg">
                                                🎤 開始錄音
                                            </button>
                                        )}
                                        {isRecording && (
                                            <div className="flex flex-col items-center gap-6">
                                                <span className="text-red-600 font-bold text-2xl animate-pulse bg-red-100 px-6 py-3 rounded-full">
                                                    🔴 錄音中... 全組一起大聲唸！
                                                </span>
                                                <button onClick={stopRecording} className="hand-drawn-btn bg-gray-800 text-white p-8 text-3xl font-bold rounded-full shadow-lg">
                                                    ⏹️ 停止錄音
                                                </button>
                                            </div>
                                        )}
                                        {audioUrl && (
                                            <div className="w-full max-w-lg flex flex-col items-center gap-8 bg-gray-50 p-8 rounded-2xl hand-drawn">
                                                <audio src={audioUrl} controls className="w-full" />
                                                <div className="flex gap-6 w-full">
                                                    <button onClick={() => setAudioUrl(null)} className="hand-drawn-btn bg-yellow-400 p-5 text-2xl font-bold flex-1">
                                                        🔄 重錄
                                                    </button>
                                                    <button onClick={submitStage4} disabled={isUploading} className="hand-drawn-btn bg-green-400 p-5 text-2xl font-bold flex-1 text-white">
                                                        {isUploading ? "上傳中⏳" : "上傳並送出📤"}
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
